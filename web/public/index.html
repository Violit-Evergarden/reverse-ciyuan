<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次元壁纸 · Web — 与 APP 同源数据</title>
<meta name="description" content="次元壁纸 (me.alzz.awsl) 的非官方 Web 版：发现/作品/排行，与 APP 同源壁纸数据。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">次元壁纸</span>
    <span class="sub">WEB · 同源数据</span>
  </div>
  <nav class="nav" id="nav">
    <button data-view="discover" class="active">发现</button>
    <button data-view="comics">作品</button>
    <button data-view="rank">排行</button>
  </nav>
  <div class="spacer"></div>
  <div class="searchbox" id="searchbox">
    <input id="search-input" type="search" placeholder="搜索 标签 / 作者 / 作品…" autocomplete="off">
    <button class="clear" id="search-clear" title="清除">✕</button>
  </div>
  <label class="toggle-r16" title="隐藏 R16 内容">
    <input type="checkbox" id="r16-toggle">
    <span class="label">隐藏 R16</span>
  </label>
</header>

<main>
  <!-- 发现 / 作品详情流 -->
  <section class="view active" id="view-discover">
    <div class="section-head" id="discover-head">
      <button class="back-btn" id="comic-back" style="display:none">← 返回作品</button>
      <div class="section-title" id="discover-title"><span class="grad">发现</span> 最新壁纸</div>
      <span class="pill" id="discover-count"></span>
      <span class="section-sub" id="search-hint" style="display:none"></span>
    </div>
    <div class="masonry" id="grid"></div>
  </section>

  <!-- 作品列表 -->
  <section class="view" id="view-comics">
    <div class="section-head">
      <div class="section-title"><span class="grad">作品</span> 合集</div>
      <span class="section-sub">按作品浏览（服务端过滤，与 APP 同源）· 索引来自最近 300 张</span>
    </div>
    <div class="comics-grid" id="comics-grid"></div>
    <div class="load-state" id="comics-loading" style="display:none"><div class="spinner"></div>聚合最近壁纸中…</div>
  </section>

  <!-- 排行 -->
  <section class="view" id="view-rank">
    <div class="section-head">
      <div class="section-title"><span class="grad">排行</span></div>
      <span class="section-sub">与 APP「排行」页同一接口</span>
    </div>
    <div class="rank-tabs" id="rank-tabs"></div>
    <div class="rank-list" id="rank-list"></div>
  </section>

  <div class="load-state" id="loader" style="display:none"><div class="spinner"></div>加载中…</div>
  <div id="sentinel"></div>
</main>

<!-- 详情弹窗 -->
<div class="modal" id="modal">
  <button class="modal-close" id="modal-close" title="关闭 (Esc)">✕</button>
  <div class="modal-body">
    <div class="modal-img-pane">
      <img id="modal-img" alt="">
      <div class="orig-hint" id="orig-hint" style="display:none"><span class="dot"></span><span id="orig-hint-text">原图加载中…</span></div>
    </div>
    <aside class="modal-side">
      <h2 id="m-title"></h2>
      <div id="m-rows"></div>
      <div class="tag-cloud" id="m-tags"></div>
      <div class="side-actions">
        <a class="btn btn-primary" id="m-download" download>⬇ 下载原图</a>
        <a class="btn btn-ghost" id="m-pixiv" target="_blank" rel="noopener" style="display:none">Pixiv 来源 ↗</a>
      </div>
    </aside>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
